[project]
name = "progres"
version = "0.1.0"
description = "Teacher environment for the PROGRES course"
readme = "README.md"
authors = [
    { name = "Fabien Mathieu", email = "fabien.mathieu@normalesup.org" }
]
requires-python = ">=3.12,<3.14"  # 3.14 breaks jupyter_client 7.x (nest_asyncio): kernel restart and shutdown fail, and notebook 6.5.7 needs jupyter_client<8
dependencies = [
    "ipykernel>=6.29.5",
    "jupyter-contrib-nbextensions==0.7.0",
    "jupyter-nbextensions-configurator==0.4.1",  # 0.6.x uses jupyter_server handlers: its auth breaks the notebook 6 login cookie
    "jupyter-server==2.17.0",
    "matplotlib>=3.11.2",
    "mpmath>=1.4.1",
    "nbclassic==1.3.3",
    "nbconvert==7.16.5",
    "notebook==6.5.7",
    "pandas>=3.0.6",
    "rise==5.7.1",
    "scipy>=1.18.1",
    "setuptools<81",  # jupyter_contrib_core imports pkg_resources, removed from recent setuptools
    "tornado==6.4.2",
    "traitlets==5.14.3",
]

[tool.uv]
package = false
